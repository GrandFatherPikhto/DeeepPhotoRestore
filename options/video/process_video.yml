# ==============================================================================
# КОНФИГУРАЦИОННЫЙ ФАЙЛ ДЛЯ ВОССТАНОВЛЕНИЯ ВИДЕО С ПОМОЩЬЮ NAFNET
# ==============================================================================

# --- ПУТИ ---
path:
  checkpoint: "experiments/RAW-NAFNet-D600/checkpoints/resume_nef_nafnet.pth"  # Путь к обученной модели

# --- ФИЗИЧЕСКАЯ ДЕГРАДАЦИЯ (применяется к каждому кадру чистого RGB-видео) ---
process_data:
  downscale_factor: 4            # Коэффициент уменьшения разрешения (перед маской Байера)
  noise:
    add: true                    # Добавлять шум
    snr_db: 20                   # Отношение сигнал/шум (дБ)
    correlated: true             # Коррелированный шум (свёртка с PSF)
    psf_sigma: 1.5               # Параметр размытия (сигма гауссианы)

# --- АРХИТЕКТУРА NAFNET (должна совпадать с использованной при обучении) ---
network_g:
  num_in_ch: 4
  num_out_ch: 3
  width: 32
  enc_blk_nums: [2, 2, 4, 8]
  middle_blk_num: 12
  dec_blk_nums: [2, 2, 2, 2]

# --- РАЗМЕР ВХОДНЫХ ДАННЫХ (должен совпадать с gt_size при обучении) ---
gt_size: 256

# --- НАСТРОЙКИ КОДЕКА (опционально) ---
output:
  codec: "mp4v"                  # Кодек для сохранения видео
  fps: null                      # Если null, сохраняется оригинальный FPS