# ==============================================================================
# КОНФИГУРАЦИОННЫЙ ФАЙЛ ДЛЯ ОБУЧЕНИЯ NAFNET НА RAW ДАННЫХ (NIKON D600)
# ==============================================================================

name: RAW-NAFNet-Test-20          # Название эксперимента (имя папки в experiments/)
manual_seed: 42                  # Фиксация случайных чисел для воспроизводимости в диссертации

path:
  path:
  source_images_dir: "/home/grand/Images/NEF_Test_20" # Либо ~, либо полный путь
  dataset_root: "datasets/nef_nafnet_20"        # Корневая папка сгенерированного датасета
  resume_path: "experiments/{name}/checkpoints/resume_nef_nafnet_20.pth"
  # pretrain_network_g: "pretrained/NAFNet-SIDD-width32.pth"

datasets:
  train:
    type: CustomNEFPairDataset   # Класс датасета из libraries/dataset_nef.py
    batch_size_per_gpu: 16       # Размер батча (снижен до 4 для экономии VRAM на 16-бит)
    num_worker_per_gpu: 4        # 🎯 Задействует 4 потока CPU для предзагрузки данных в GPU
    auto_resume: true            # Автоматически продолжать обучение с последнего чекпоинта
    save_checkpoint_epoch: 5     # Как часто делать валидацию и сохранять веса (в эпохах)
    gt_size: 256                 # Размер целевого RGB изображения (HQ)
    lq_size: 128                 # Размер входного подканала RAW (LQ)    

# === КОНФИГУРАЦИЯ ФИЗИЧЕСКОЙ ДЕГРАДАЦИИ СИГНАЛА (п. 12 ТЗ) ===
process_data:
  downscale_factor: 4            # Коэффициент уменьшения разрешения (п. 12.3)
  noise:
    add: true                    # Флаг добавления шума (п. 12.4)
    snr_db: 20                   # Требуемое отношение сигнал/шум в децибелах
    correlated: true             # Включение КОРРЕЛИРОВАННОГО шума (свёртка с ЧКХ, п. 12.7)
    psf_sigma: 0.5               # Параметр размытия оптической системы (сигма Гауссианы)

# === НАСТРОЙКИ СЕТИ ДЛЯ ИМПОРТА И АДАПТАЦИИ NAFNET ===
network_g:
  type: NAFNet
  arch_file: "modules/NAFNet/basicsr/models/archs/NAFNet_arch.py" # Точный путь к файлу архитектуры
  class_name: "NAFNet"           # Имя класса внутри файла архитектуры
  num_in_ch: 4                   # КРИТИЧЕСКИ: 4 входных канала мозаики матрицы (R, G1, G2, B)
  num_out_ch: 3                  # КРИТИЧЕСКИ: 3 выходных канала целевого RGB референса
  width: 32                      # Базовая ширина сверточных каналов в блоках NAFNet
  enc_blk_nums: [2, 2, 4, 8]     # Количество блоков на этапах кодировщика (Encoder)
  middle_blk_num: 12             # Количество блоков в латентном пространстве (Bottleneck)
  dec_blk_nums: [2, 2, 2, 2]     # Количество блоков на этапах декодировщика (Decoder)
  upscale_factor: 2   # явно указываем масштаб

# === ПАРАМЕТРЫ ЦИКЛА ОБУЧЕНИЯ ===
train:
  validation_freq: 1
  save_checkpoint_epoch: 5
  optim_g:
    lr: !!float 1e-4             # 🎯 ИСПРАВЛЕНО: Поднимаем скорость в 100 раз! Даем сети градиентную энергию
    weight_decay: 1e-4           
    betas: [0.9, 0.999]          # Стандартные беты для стабильности AdamW
  num_epochs: 200
  scheduler:
    eta_min: 1e-7

losses:
  type: "combined"
  l1_weight: 0.2                 # 🎯 Жёстко зажимаем L1, чтобы убрать избыточное пространственное размытие
  ffl_weight: 1.5                # 🎯 Выкручиваем вес Log-FFL на максимум, заставляя градиенты выжигать сетку
  ffl_alpha: 2.0                 # 🎯 Фокусировка 2.0: штрафуем сеть за промахи строго на высоких частотах муара
  ffl_log_factor: 100.0           
  ffl_type: "log"                # Твой отлаженный логарифмический тип частотных потерь

# === НАСТРОЙКИ ТЕЛЕМЕТРИИ И КАСТОМНОГО ЛОГГЕРА ДЛЯ ДИССЕРТАЦИИ ===
logger:
  print_freq: 2                  # Как часто выводить информацию в КОНСОЛЬ (каждый N-й батч)
  use_tb_logger: true            # Включить построение графиков в TensorBoard
  log_file_name: "train_progress.log" # Имя файла для сохранения числовой динамики
  csv_file_name: "train_metrics.csv" # имя CSV-файла
  log_csv: true                  # включаем запись в CSV
  file_log_freq: 1               # Как часто дописывать метрики в ФАЙЛ (каждый N-й батч)
  log_loss_components: true      # записывать отдельно L1 и FFL
  
  # Настройки оперативного вывода на экран в процессе работы батчей
  include_in_console:
    loss: true                   # Показывать текущий L1 Лосс
    psnr: true                   # Показывать расчетный PSNR (dB)
    vram: true                   # Отслеживать аллокацию памяти видеокарты в ГБ
    learning_rate: false         # Скрыто на экране для читаемости строки

  # Настройки сохранения расширенной аналитики в текстовый файл .log
  include_in_file_log:
    loss: true                   # Сохранять историю L1 потерь
    psnr: true                   # Сохранять историю PSNR
    learning_rate: true          # Мониторинг шагов изменения скорости обучения
    delta_psnr: true             # Расчет dPSNR (маркер выхода на плато / затухания градиентов)
    grad_variance: true          # Расчет дисперсии градиентов весов (детектор «путаницы» сети)
    tv_ratio: true               # Расчет Total Variation Ratio (детектор появления шума или мыла)
    vram_usage: true             # Фиксация точной утилизации памяти GPU (Allocated/Reserved)
    log_ssim: true   # <-- новый флаг

# Настройки визуального контроля и дебага
visuals_logger:
  output_dir: "experiments/{name}/debug_visuals"
  lq_preview_name: "debug_lq_preview.png"
  gt_reference_name: "debug_gt_reference.png"

# Настройки сквозного логирования процесса
pipeline_logger:
  log_file: "experiments/{name}/pipeline.log"

