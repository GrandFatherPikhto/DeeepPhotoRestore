name: NAFNet-100-02
experiment_dir: "experiments/{name}"
output_dir: "experiments/{name}/figures"

# Секция с путями к файлам данных
data_files:
  train_metrics: "experiments/{name}/train_metrics.csv"
  val_metrics: "experiments/{name}/val_metrics.csv"
  include_in_file_log:
      loss: true
      psnr: true
      learning_rate: true
      delta_psnr: true
      grad_variance: true
      tv_ratio: true
      vram_usage: true
      log_ssim: true
      
baseline:
  psnr: 34.61
  ssim: 0.9640
  label: "Bilinear"

plots:
  - type: line
    title: "Кривая потерь (Loss)"
    data:
      source: csv
      file_ref: train_metrics
      x: step
      y: loss
    smoothing: 0.9
    y_label: "Loss"
    save: loss_curve.png

  - type: line
    title: "PSNR на обучении"
    data:
      source: csv
      file_ref: train_metrics
      x: step
      y: psnr
    smoothing: 0.95
    y_lim: [3, 45]
    y_label: "PSNR (dB)"
    save: psnr_curve.png

  - type: line
    title: "Learning Rate"
    data:
      source: csv
      file_ref: train_metrics
      x: step
      y: lr
    y_scale: log
    y_label: "Learning rate"
    save: lr_schedule.png

  - type: comparison
    title: "Сравнение PSNR: NAFNet vs Bilinear"
    data:
      source: csv
      file_ref: train_metrics
      x: step
      y: psnr
    baseline_value: 31.13
    baseline_label: "Bilinear"
    y_label: "PSNR (dB)"
    x_lim: [0, 150]   # добавить эту строку
    save: psnr_comparison.png

  - type: line
    title: "SSIM на валидации"
    data:
      source: val_csv
      x: epoch
      y: ssim
    y_lim: [0.0, 1]      # ← измените на [0.0, 0.5] или уберите эту строку
    y_label: "SSIM"
    save: ssim_curve.png

  - type: multi_line
    title: "Дополнительные метрики"
    data:
      source: csv
      file_ref: train_metrics
      x: step
      y: [delta_psnr, grad_var, tv_ratio]
    y_scale: log
    y_label: "Значение"
    legend: ["ΔPSNR", "Grad variance", "TV ratio"]
    save: aux_metrics.png