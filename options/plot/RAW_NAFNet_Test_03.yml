experiment_dir: "experiments/RAW-NAFNet-Test-03"
output_dir: "experiments/RAW-NAFNet-Test-03/figures"

# Секция с путями к файлам данных
data_files:
  train_metrics: "experiments/RAW-NAFNet-Test-03/train_metrics.csv"
  val_metrics: "experiments/RAW-NAFNet-Test-03/val_metrics.csv"

baseline:
  psnr: 34.61
  ssim: 0.9640
  label: "Bilinear"

plots:
  - type: line
    title: "Кривая потерь (Loss)"
    data:
      source: csv
      file_ref: train_metrics
      x: step
      y: loss
    smoothing: 0.9
    y_label: "Loss"
    save: loss_curve.png

  - type: line
    title: "PSNR на обучении"
    data:
      source: csv
      file_ref: train_metrics
      x: step
      y: psnr
    smoothing: 0.95
    y_lim: [3, 35]
    y_label: "PSNR (dB)"
    save: psnr_curve.png

  - type: line
    title: "Learning Rate"
    data:
      source: csv
      file_ref: train_metrics
      x: step
      y: lr
    y_scale: log
    y_label: "Learning rate"
    save: lr_schedule.png

  - type: comparison
    title: "Сравнение PSNR: NAFNet vs Bilinear"
    data:
      source: csv
      file_ref: train_metrics
      x: step
      y: psnr
    baseline_value: 6
    baseline_label: "Bilinear"
    y_label: "PSNR (dB)"
    x_lim: [0, 150]   # добавить эту строку
    save: psnr_comparison.png

  - type: line
    title: "SSIM на валидации"
    data:
      source: val_csv
      x: epoch
      y: ssim
    y_lim: [0.0, 0.5]      # ← измените на [0.0, 0.5] или уберите эту строку
    y_label: "SSIM"
    save: ssim_curve.png

  - type: multi_line
    title: "Дополнительные метрики"
    data:
      source: csv
      file_ref: train_metrics
      x: step
      y: [delta_psnr, grad_var, tv_ratio]
    y_scale: log
    y_label: "Значение"
    legend: ["ΔPSNR", "Grad variance", "TV ratio"]
    save: aux_metrics.png