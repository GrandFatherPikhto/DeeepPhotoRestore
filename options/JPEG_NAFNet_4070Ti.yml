name: JPEG-NAFNet-4070Ti  # Поменяйте имя, чтобы результаты легли в новую папку

path:
  source_images_dir: "jpeg_images"
  dataset_root: "datasets/jpeg_fcn"
  # === ИЗМЕНЕНО: Веса теперь будут копироваться в отдельный файл ===
  resume_path: "checkpoints/resume_jpeg_nafnet.pth" 

datasets:
  train:
    type: PairedImageDataset
    batch_size_per_gpu: 8
    auto_resume: true
    save_checkpoint_epoch: 1

# === НАСТРОЙКИ СЕТИ ДЛЯ ИМПОРТА ОРИГИНАЛЬНОЙ NAFNet ===
network_g:
  type: NAFNet
  arch_file: "modules/NAFNet/basicsr/models/archs/NAFNet_arch.py" # Точный путь до файла из твоего поиска
  class_name: "NAFNet"
  num_in_ch: 3
  num_out_ch: 3
  width: 32
  enc_blk_nums: [2, 2, 4, 8]
  middle_blk_num: 12
  dec_blk_nums: [2, 2, 2, 2]

train:
  num_epochs: 100
  optim_g:
    lr: !!float 1e-3

# 📊 Настройки логирования, консоли и телеметрии
logger:
  print_freq: 2                   # Как часто писать в КОНСОЛЬ (в батчах)
  use_tb_logger: true             # Включаем TensorBoard графики
  
  # Настройки текстового файла лога
  log_file_name: "train_progress.log"
  file_log_freq: 1                # Как часто писать в ФАЙЛ (каждый N-й батч)
  
  # 🎯 НАСТРОЙКИ ВЫВОДА В КОНСОЛЬ
  include_in_console:
    loss: true                    # Показывать L1 Лосс
    psnr: true                    # Показывать PSNR
    vram: true                    # Показывать занятую память видеокарты
    learning_rate: false          # Скрыто (чтобы не забивать строку)

  # 🎯 НАСТРОЙКИ СОХРАНЕНИЯ В ТЕКСТОВЫЙ ФАЙЛ LOG
  include_in_file_log:
    loss: true                    
    psnr: true                    
    learning_rate: true           
    delta_psnr: true              # Детектор ленивого плато
    grad_variance: true           # Детектор путаницы сети
    tv_ratio: true                # Детектор кубиков/мыла
    vram_usage: true              # Память GPU (Allocated/Reserved)
